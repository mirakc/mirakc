[graph]
all-features = true
# Windows platforms are not supported.
targets = [
    # tier-1
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    # tier-2
    "arm-unknown-linux-gnueabi",
    "arm-unknown-linux-gnueabihf",
    "armv7-unknown-linux-gnueabihf",
]

[advisories]
yanked = "deny"

[bans]
allow-wildcard-paths = true
wildcards = "warn" # TODO: "deny"

[bans.build]
executables = "deny"

[[bans.deny]]
name = "serde-yml"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Allow the forked utoipa repository used for the zip dependency patch.
#
# TODO: Remove once a new version of utoipa-swagger-ui with zip v9 is released.
# Ref: https://github.com/juhaku/utoipa/pull/1645
allow-git = [
    "https://github.com/mirakc/utoipa",
]
